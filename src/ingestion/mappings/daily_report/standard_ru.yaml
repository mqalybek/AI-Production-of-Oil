# Типовой формат суточного рапорта (скважина x сутки) — колонки, как они
# встречаются в классических суточных сводках "Детализация по скважинам".
# Под конкретную компанию, если заголовки другие, заводится свой файл
# конфига рядом — код источника не меняется.

external_system: "daily_report_ru"   # ключ в well_alias.external_system

well_id_aliases:
  - "№ скважины"
  - "№ скв."
  - "Скважина"

date_column_aliases:
  - "Дата"

source_type_column_aliases:
  - "Тип источника замера"
  - "Источник замера"
  - "source_type"

comment_column_aliases:
  - "Примечание"
  - "Примечание (простой/недоработка)"

equipment_type_column_aliases:
  - "Способ эксплуатации"

header_rows: 1

fields:
  hours_on:
    - "Часы работы, ч"
    - "Часы работы"
  q_liquid_m3:
    - "Дебит жидкости, м3/сут"
    - "Дебит жидкости"
  water_cut_pct:
    - "Обводнённость, %"
    - "Обводненность, %"
    - "Обводн., %"
  q_gas_thousand_m3:
    - "Дебит газа, тыс.м3/сут"
    - "Дебит газа"
