# Типовой формат помесячного рапорта по добыче (скважина x месяц) —
# колонки, как они встречаются в классических Excel-выгрузках "Добыча"/
# "Помесячная добыча". Под конкретную компанию, если у неё другие
# заголовки, заводится свой файл конфига рядом — код источника не меняется.

external_system: "monthly_report_ru"   # ключ в well_alias.external_system

well_id_aliases:
  - "Скважина"
  - "№ скважины"

date_column_aliases:
  - "Дата"

reservoir_column_aliases:
  - "Объект"

horizon_column_aliases:
  - "Горизонт"

header_rows: 1

fields:
  calendar_days:
    - "Календарные дни"
  working_days:
    - "Отр дни"
    - "Отработанные дни"
  q_oil_t:
    - "Доб нефти"
    - "Добыча нефти"
    - "Добыча нефти, т"
  q_water_t:
    - "Доб воды"
    - "Добыча воды"
    - "Добыча воды, т"
  q_gas_m3:
    - "Доб газа"
    - "Добыча газа"
    - "Добыча газа, м3"
  gor:
    - "ГФ"
    - "Газовый фактор"
  q_liquid_t:
    - "Доб жидкости"
    - "Добыча жидкости"
    - "Добыча жидкости, т"
  water_cut_pct:
    - "Обводненность"
    - "Обводнённость"
  q_oil_rate_t_d:
    - "Дебит нефти, т/сут"
    - "Дебит нефти"
