# Пример маппинга колонок суточного рапорта в CSV/Excel. Под каждый реальный
# формат рапорта (у каждого промысла свой) заводится свой такой файл — код
# CsvSource не меняется, меняется только конфиг.

external_system: "1c"   # ключ в well_alias.external_system, по которому резолвится скважина

well_id_aliases:
  - "Скважина"
  - "№ скважины"
  - "Ұңғыма"

date_column_aliases:
  - "Дата"
  - "Күні"

header_rows: 1   # >1 — для Excel с многострочной шапкой (объединённые ячейки разворачиваются)

columns:
  - tag: q_oil_daily
    unit: t/d
    aliases:
      - "Дебит нефти, т/сут"
      - "Дебит нефти"
      - "Мұнай дебиті, т/тәу"

  - tag: q_liquid_daily
    unit: t/d
    aliases:
      - "Дебит жидкости, т/сут"
      - "Дебит жидкости"
      - "Сұйықтық дебиті"

  - tag: q_water_daily
    unit: m3/d
    aliases:
      - "Дебит воды, м3/сут"
      - "Дебит воды"

  - tag: q_gas_daily
    unit: m3/d
    aliases:
      - "Дебит газа, м3/сут"
      - "Дебит газа"

  - tag: hours_on_daily
    unit: h
    aliases:
      - "Наработка, ч"
      - "Время работы, ч"

  - tag: p_buf
    unit: atm
    aliases:
      - "Рбуф, атм"
      - "Буферное давление"

  - tag: p_zatr
    unit: atm
    aliases:
      - "Рзатр, атм"
      - "Затрубное давление"
