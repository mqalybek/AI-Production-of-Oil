services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: production_monitoring_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitoring}
      POSTGRES_DB: ${POSTGRES_DB:-production_monitoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
