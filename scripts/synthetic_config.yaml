# Конфиг генератора синтетического промысла (scripts/generate_synthetic_field.py).
# Меняя эти параметры, можно масштабировать размер месторождения и уровень шума
# без правки кода.

seed: 42

history:
  start_date: "2022-01-01"
  days: 1095   # 3 года

field:
  name: "Синтетическое"
  reservoirs: ["Объект А", "Объект Б"]

wells:
  n_producers: 40
  n_injectors: 10
  n_piezometric: 3

gathering:
  n_agzu: 4
  n_dns: 1

production:
  qo_initial_t_d: {min: 5, max: 120}       # начальный дебит нефти, логнормальное распределение
  arps_b: {min: 0.3, max: 0.8}             # коэффициент гиперболы Арпса
  initial_annual_decline: {min: 0.08, max: 0.25}
  well_test_interval_days: {min: 5, max: 10}   # раз в сколько суток АГЗУ тестирует скважину
  water_cut:
    start: {min: 0.0, max: 0.15}
    end_high: {min: 0.85, max: 0.95}       # куда доходит обводнённость у "обводняющихся" скважин
    fraction_high_wc_wells: 0.5            # доля скважин, которые доходят до высокой обводнённости
  gor:
    base_range_m3_t: {min: 40, max: 120}
    days_to_bubble_point: {min: 300, max: 900}   # когда условное Рпл проходит точку насыщения
    ramp_up_factor: 1.8                          # во сколько раз растёт ГФ после этого

pressures:
  p_buf_atm: {min: 8, max: 25}
  p_buf_noise_std: 0.8
  p_zatr_base_atm: {min: 10, max: 30}
  p_zatr_depth_coef: 0.01    # атм на метр глубины спуска насоса
  p_zatr_noise_std: 0.6

esp_telemetry:
  measurement_interval_minutes: 240   # раз в 4 часа
  esp_run_depth_m: {min: 1500, max: 2500}
  current_a: {min: 25, max: 60}
  load_pct: {min: 40, max: 95}
  freq_hz: {min: 40, max: 50}
  intake_pressure_atm: {min: 5, max: 20}
  daily_cycle_amplitude_pct: 5
  noise_std_pct: 3

events:
  esp_mtbf_days: {min: 400, max: 700}          # экспоненциальное распределение наработки на отказ
  workover_duration_days: {min: 3, max: 10}
  workover_events_per_well_per_year: 0.3       # ~1 плановый ремонт на скважину за ~3 года
  power_outage:
    events_per_year: 6                          # на всё месторождение, по кусту (узлу)
    duration_hours: {min: 1, max: 6}
  gtm:
    events_per_year: {min: 2, max: 5}
    oil_uplift_fraction: {min: 0.15, max: 0.6}
    decline_acceleration_factor: {min: 1.3, max: 2.0}

dirty_data:
  well_test_short_duration_fraction: {min: 0.05, max: 0.08}
  well_test_outlier_fraction: {min: 0.02, max: 0.03}
  telemetry_gap_probability_per_well_per_month: 0.3
  telemetry_gap_duration_hours: {min: 3, max: 18}
  impossible_value_count: 15
  node_vs_wells_mismatch_pct: {min: 3, max: 12}
  wells_with_long_gaps_count: 4
  long_gap_duration_days: {min: 20, max: 40}

output:
  csv_dir: "data/synthetic"
  write_to_db: true
  truncate_before_write: true
